models:

  - name: stg_customers

    columns:

      - name: customer_id

        data_tests:
          - unique
          - not_null

      - name: email
        data_tests:
          - not_null
      
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - completed
                  - pending
                  - cancelled  

      - name: customer_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_customers')
                field: customer_id              

